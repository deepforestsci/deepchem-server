name: deepchem-server-env
channels:
  - conda-forge
  - pytorch
  - dglteam
  - pyg
  - defaults
dependencies:
  - python>=3.10
  - pandas
  - fastapi
  - pytest
  - numpy<1.24
  - scikit-learn=1.3.2
  - pillow=10.3.0
  - transformers=4.39.3
  - pdbfixer
  - vina
  - pip
  - pip:
    - python-multipart
    - uvicorn[standard]
    - torchdata<0.8.0
    - deepchem --pre
    - dgl -f https://data.dgl.ai/wheels/torch-2.1/repo.html
    - dgllife
    - torch==2.1.0
    - torch_geometric
    - rdkit==2022.9.5

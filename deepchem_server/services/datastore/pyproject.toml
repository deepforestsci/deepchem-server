[project]
name = "deepchem-datastore"
version = "0.1.0"
description = "Internal Datastore Service for DeepChem Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "deepchem-core-common",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
deepchem-core-common = { workspace = true }

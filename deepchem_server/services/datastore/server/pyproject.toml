[project]
name = "deepchem-datastore-server"
version = "0.1.0"
description = "DeepChem Datastore HTTP Server - Centralized file storage service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepchem_server/services/datastore/server"]

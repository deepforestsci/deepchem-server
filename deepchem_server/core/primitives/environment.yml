name: deepchem-core-primitives
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Conda-specific dependencies (not available via pip)
  - conda-forge::pdbfixer
  - conda-forge::vina
  - conda-forge::openfe=1.1.0
  - conda-forge::openmm=8.0
  - pip
  - pip:
      # Core dependencies
      - pandas>=2.0.0
      - numpy>=1.24.0,<2.0
      - scikit-learn>=1.3.2,<1.6
      - pillow>=10.0.0
      - rdkit==2022.9.5
      # DeepChem and ML dependencies
      - --pre
      - deepchem
      - torch==2.1.0
      - transformers==4.39.3
      - torchdata<0.8.0
      - dgl
      - dgllife
      - torch_geometric
      # Utilities
      - importlib_resources
      # Local package (editable install)
      - -e ..


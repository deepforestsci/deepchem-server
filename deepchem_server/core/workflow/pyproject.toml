[project]
name = "deepchem-core-workflow"
version = "0.1.0"
description = "Workflow execution engine for DeepChem Server - orchestrates primitives into compute workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "deepchem-core-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# UV workspace source - use workspace version during development
# When publishing, this is ignored and the published deepchem-core-common is used
[tool.uv.sources]
deepchem-core-common = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


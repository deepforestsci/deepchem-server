[project]
name = "deepchem-server"
version = "0.1.0"
description = "DeepChem Server - ML platform for chemistry and drug discovery"
requires-python = ">=3.11"
# Base dependencies (minimal, no ML)
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "pandas>=2.0.0",
    "redis",
    "rq",
    "sqlalchemy",
]

[project.optional-dependencies]
# Gateway-only (already in base deps)
common = []

# ML dependencies (heavy)
ml = [
    "deepchem",
    "scikit-learn>=1.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

# Full installation (common + ml) - default for workers
full = [
    "deepchem-server[ml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepchem_server"]

[project.scripts]
deepchem-server = "deepchem_server.api.main:app"

# UV Workspace configuration
# Each member can be developed together and published independently
[tool.uv.workspace]
members = [
    "cli",
    "deepchem_server/services/datastore/server",
    "deepchem_server/services/datastore/client",
]

[tool.pytest.ini_options]
filterwarnings = [
    "always::FutureWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]
# Note: deepchem_server/core/primitives uses conda/mamba (not UV-managed)

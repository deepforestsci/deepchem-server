name: Run PyDS test on live server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "pyds/**"
      - "deepchem_server/**"
      - "docker.sh"
      - "docker-compose.yml"
      - "Dockerfile"
      - "scripts/pytest_pyds.sh"
      - ".github/actions/cleanup/action.yml"
      - ".github/workflows/pyds-test.yml"
  workflow_dispatch:

jobs:
  run-test-pyds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Clean up unnecessary pre-installed software
        uses: ./.github/actions/cleanup

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip &&
          pip install --no-cache-dir -r pyds/requirements.txt &&
          pip install --no-cache-dir typer psutil pyyaml httpx rich &&
          pip install --no-cache-dir -r pyds/tests/requirements.txt

      - name: Build Docker images (required for CLI start)
        run: |
          docker-compose build

      - name: Make pytest script executable
        run: chmod +x ./scripts/pytest_pyds.sh

      - name: Run tests
        run: |
          if ./scripts/pytest_pyds.sh; then
            echo "Tests passed"
            exit 0
          else
            docker-compose ps || true
            docker-compose logs --tail=200 || true
            echo "Tests failed! Check the logs above for debugging."
            exit 1
          fi

[project]
name = "deepchem-server-cli"
version = "0.1.0"
description = "CLI tool for managing DeepChem Server services"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
]

[project.scripts]
deepchem-server-cli = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
